spring:
  application:
    name: nba2k-assistant-core
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nba2kassistant}
    username: ${DB_USER:nba2kassistant}
    password: ${DB_PASSWORD:nba2kassistant}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates it matches the entities
      # so a mismatched entity fails fast at startup instead of silently altering tables.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

nba2kassistant:
  nba2kapi:
    base-url: ${NBA2KAPI_BASE_URL:https://api.nba2kapi.com}
    api-key: ${NBA2KAPI_API_KEY:}
  seed:
    # Bootstrap fallback used when no NBA2KAPI_API_KEY is configured — see
    # JsonSeedLoader. Points at the existing scraper output, copied into
    # resources/seed/players.json.
    players-json-path: ${NBA2KASSISTANT_SEED_PATH:classpath:seed/players.json}
  llm:
    # Falls back to TemplateNarrationClient (no external call) when blank — see LlmClientSelector.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
  dynamodb:
    # Blank endpoint resolves against real AWS; set for LocalStack (docker-compose sets
    # this to http://localstack:4566). Reads/writes are best-effort (see CoachingEventLogRepository/
    # MatchupHistoryRepository) — DynamoDB being unreachable never fails a user-facing request.
    endpoint: ${DYNAMODB_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
