plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.nba2kassistant'
version = '0.1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	awsSdkVersion = '2.28.11'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Schema migrations, not JPA ddl-auto — versioned SQL is what a real
	// team reviews in a PR; ddl-auto is fine for a toy but not for this.
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	runtimeOnly 'org.postgresql:postgresql'

	// DynamoDB v2 SDK, used only by MatchupHistory/CoachingEventLog repos (Milestone 6-7).
	implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
	implementation 'software.amazon.awssdk:dynamodb-enhanced'

	// Official Anthropic SDK for coaching narration (Milestone 6) — falls back to
	// TemplateNarrationClient when no ANTHROPIC_API_KEY is configured, same
	// pattern as NbaTwoKApiClient/JsonSeedLoader in Milestone 1.
	implementation 'com.anthropic:anthropic-java:2.34.0'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Testcontainers: the plan's testing strategy calls for real-Postgres
	// coverage of query-shape-sensitive logic ("don't mock the DB here") —
	// PlayerRepositoryIntegrationTest is that test, run in CI (Milestone 9).
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
}
