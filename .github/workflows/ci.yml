name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    name: core (JUnit + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('core/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      # Testcontainers needs a real Docker daemon; GitHub-hosted Ubuntu
      # runners provide one natively (no setup required) — the same
      # PlayerRepositoryIntegrationTest that can't reach Docker's raw API in
      # a locked-down local sandbox runs for real here.
      - name: Run tests
        working-directory: core
        run: ./gradlew --no-daemon test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: core/build/test-results/test
          retention-days: 7

  web-build:
    name: web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Build (includes typecheck)
        working-directory: web
        run: npm run build

  vision-tests:
    name: vision (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The two test files exercise app/main.py and app/capture/regions.py
      # only — neither imports OpenCV/EasyOCR/torch, so CI installs just the
      # lightweight web/config dependencies rather than the full (large,
      # slow) requirements.txt used at runtime.
      - name: Install lightweight test dependencies
        run: pip install fastapi==0.115.0 httpx==0.27.2 pydantic==2.9.2 pydantic-settings==2.5.2 pytest==8.3.3

      - name: Run tests
        working-directory: vision
        run: python -m pytest -q
